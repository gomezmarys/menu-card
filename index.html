<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Menu Card (Day 3) -->
    <h1>Irie Seoul Menu Card</h1>
    <form id="menu-form">
      <label for="menu-input">Paste your menu as JSON</label>
      <textarea id="menu-input" rows="8">
[
        {"name": "Jerk Bulgogi Tacos", "price": 11},
        {"name": "Plantain Bao", "price": 7.5},
        {"name": "Gochujang Oxtail Bowl", "price": 15},
        {"name": "Festival Sliders", "price": 9} ]</textarea
      >
      <button type="submit">Show my menu</button>
    </form>

    <!--Empty on purpose, JS fills these in after the click of the button-->
    <p id="count"></p>
    <p id="menu-text"></p>
    <!--Script goes at the bottom so the HTML loads first-->
    <script src="script.js"></script>
  </body>
</html>
